services:
  app:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: production
      PORT: 3000
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      CUSTOMER_API_BASE_URL: ${CUSTOMER_API_BASE_URL:-https://assessment-api-gamma.vercel.app}
      CUSTOMER_API_TOKEN: ${CUSTOMER_API_TOKEN:-}
      CUSTOMER_NAME: ${CUSTOMER_NAME:-Assessment API}
      CUSTOMER_API_TIMEOUT_MS: ${CUSTOMER_API_TIMEOUT_MS:-10000}
      CUSTOMER_API_MAX_RETRIES: ${CUSTOMER_API_MAX_RETRIES:-3}
      CUSTOMER_API_PAGE_SIZE: ${CUSTOMER_API_PAGE_SIZE:-100}
      SYNC_CRON: ${SYNC_CRON:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
    ports:
      - "3000:3000"
